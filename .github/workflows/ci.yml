name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # Static, cached ffmpeg + ffprobe on every OS, independent of apt/brew
      # mirrors (GitHub-hosted apt mirrors intermittently stall).
      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Verify ffmpeg
        run: ffmpeg -version | head -1 && ffprobe -version | head -1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install with dev extras
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Ruff lint
        run: .venv/bin/ruff check src tests

      - name: Run test suite (offline)
        run: .venv/bin/python -m pytest -q --cov-fail-under=100

      - name: Build wheel and sdist
        run: uv build
