name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # Linux: cached static ffmpeg+ffprobe, independent of the intermittently
      # stalling GitHub apt mirrors (setup-ffmpeg is x64-only, hence Linux-only).
      - name: Install ffmpeg (Linux, static)
        if: runner.os == 'Linux'
        uses: FedericoCarboni/setup-ffmpeg@v3

      # macOS runners are arm64; Homebrew provides a native ffmpeg reliably.
      - name: Install ffmpeg (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: |
          if brew list ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already installed via brew"
          else
            brew install ffmpeg
          fi

      - name: Verify ffmpeg
        run: ffmpeg -version | head -1 && ffprobe -version | head -1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install with dev extras
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Ruff lint
        run: .venv/bin/ruff check src tests

      - name: Run test suite (offline)
        run: .venv/bin/python -m pytest -q --cov-fail-under=100

      - name: Build wheel and sdist
        run: uv build
