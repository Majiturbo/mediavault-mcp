name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          # GitHub ubuntu runners ship ffmpeg in the image; only install when absent.
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg preinstalled: $(ffmpeg -version | head -1)"
            exit 0
          fi
          # Fallback for minimal images: bound apt with timeout so a stalled
          # GH mirror becomes a non-zero exit and the retry loop can recover.
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get update && sudo timeout 300 apt-get install -y ffmpeg; then
              break
            fi
            echo "apt attempt ${attempt} failed or timed out; retrying..." >&2
            sleep 10
          done
          ffmpeg -version | head -1

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          if brew list ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already installed via brew"
          else
            brew install ffmpeg
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv and install with dev extras
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Ruff lint
        run: .venv/bin/ruff check src tests

      - name: Run test suite (offline)
        run: .venv/bin/python -m pytest -q --cov-fail-under=100

      - name: Build wheel and sdist
        run: uv build
