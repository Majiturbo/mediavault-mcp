[project]
name = "mediavault-mcp"
version = "0.1.0"
description = "Local stdio MCP server: paste a link, get native no-watermark media from any platform (adapter-based, with a summarization pipeline on the roadmap)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mediavault" }]
dependencies = [
    "mcp>=1.2.0,<2",
    "yt-dlp>=2024.10.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[project.scripts]
mediavault = "mediavault.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediavault"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=mediavault --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/mediavault"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]
