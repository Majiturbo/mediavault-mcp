[project]
name = "mediavault-mcp"
version = "0.1.0"
description = "Local stdio MCP server: paste a link, get native no-watermark media from any platform, with a multimodal (ASR + keyframe VLM + caption) video summarization pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mediavault contributors" }]
keywords = ["mcp", "media", "video", "no-watermark", "yt-dlp", "f2", "summarization", "asr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.2.0,<2",
    "yt-dlp>=2024.10.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.8.0"]
# Local, fully offline speech-to-text. The default OpenAI-compatible ASR
# path needs no extra dependency.
local-asr = ["faster-whisper>=1.0.0"]
# M4: local real browser that clears JS-VM anti-bot challenges; the browser
# binary itself still needs `playwright install chromium` once after install.
browser = ["playwright>=1.48.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[project.scripts]
mediavault = "mediavault.__main__:main"

[project.urls]
Homepage = "https://github.com/Majiturbo/mediavault-mcp"
Repository = "https://github.com/Majiturbo/mediavault-mcp"
Issues = "https://github.com/Majiturbo/mediavault-mcp/issues"
Changelog = "https://github.com/Majiturbo/mediavault-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediavault"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=mediavault --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/mediavault"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.\\s*$",
]
